<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visual SQL</title>
    <script>
      // Ставим тему до первой отрисовки, чтобы тёмная тема не мигала светлым фоном
      try {
        var saved = JSON.parse(localStorage.getItem('vs-settings') || '{}');
        var theme = (saved.state || {}).theme;
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
